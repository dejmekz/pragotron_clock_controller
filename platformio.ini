; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Arduino Nano ESP32 (ESP32-S3) — drop-in replacement for the Nano.
; Serial is the native USB port. If upload fails, double-tap the RESET
; button to enter the bootloader and try again.
[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
